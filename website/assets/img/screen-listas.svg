  <!-- Cartão 3 -->
  <rect x="20" y="302" width="280" height="72" rx="14" fill="#fff"/>
  <circle cx="46" cy="338" r="18" fill="#CDE9D3"/>
  <rect x="38" y="332" width="16" height="14" rx="2" fill="none" stroke="#1F8A3D" stroke-width="1.6"/>
  <path d="M40 332v-2h12v2" fill="none" stroke="#1F8A3D" stroke-width="1.6"/>
