  <text x="76" y="362" font-family="-apple-system,Helvetica" font-size="11" fill="#1F8A3D">📍 Leroy Merlin</text>

  <!-- FAB -->
  <circle cx="272" cy="530" r="26" fill="#1F8A3D"/>
  <path d="M272 518v24M260 530h24" stroke="#fff" stroke-width="3" stroke-linecap="round"/>

