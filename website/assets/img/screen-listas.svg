<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" width="320" height="640" role="img" aria-label="Ecrã Listas do Opticart">
  <!-- Moldura telemóvel -->
  <rect x="4" y="4" width="312" height="632" rx="40" ry="40" fill="#1a1a1a"/>
